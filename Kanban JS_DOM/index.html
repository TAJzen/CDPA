<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kanban Board</title>
    <style>
        /* CSS will go here */
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Kanban Task Board</h1>
            <p>Tasks: <span id="task-count">0</span></p>
        </header>

        <main class="grid">
            <section id="todo" class="column">
                <h2>To Do</h2>
                <div id="todo-list" class="task-list"></div>
                <button class="add-btn" data-column="todo">+ Add Task</button>
            </section>

            <section id="inprogress" class="column">
                <h2>In Progress</h2>
                <div id="inprogress-list" class="task-list"></div>
                <button class="add-btn" data-column="inprogress">+ Add Task</button>
            </section>

            <section id="done" class="column">
                <h2>Done</h2>
                <div id="done-list" class="task-list"></div>
                <button class="add-btn" data-column="done">+ Add Task</button>
            </section>
        </main>
    </div>

    <script>
        // JavaScript logic will go here
    </script>
</body>
</html>
