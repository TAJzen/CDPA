<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Kanban Task Board</h1>
            <div class="badge" id="task-counter">0 tasks</div>
        </header>

        <div class="grid">
            <section class="card" id="todo-col">
                <h2>To Do</h2>
                <div id="todo-list" class="task-list"></div>
                <button class="add-btn" data-column="todo-list">+ Add Task</button>
            </section>

            <section class="card" id="inprogress-col">
                <h2>In Progress</h2>
                <div id="inprogress-list" class="task-list"></div>
                <button class="add-btn" data-column="inprogress-list">+ Add Task</button>
            </section>

            <section class="card" id="done-col">
                <h2>Done</h2>
                <div id="done-list" class="task-list"></div>
                <button class="add-btn" data-column="done-list">+ Add Task</button>
            </section>
        </div>
    </div>

    <script src="taskmanager.js"></script>
</body>
</html>
