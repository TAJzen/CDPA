<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow - Lab 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="search-wrapper">
            <div class="search-bar">
                <input type="text" id="city-input" placeholder="Type city (e.g. Johor)..." autocomplete="off">
                <button id="search-btn">Search</button>
            </div>
            <div class="unit-controls">
                <span>°C</span>
                <label class="switch">
                    <input type="checkbox" id="unit-switch">
                    <span class="slider round"></span>
                </label>
                <span>°F</span>
            </div>
        </div>

        <div id="suggestion-card" class="suggestion-card is-hidden">
            <label>Matching Cities</label>
            <div id="suggestion-list"></div>
        </div>

        <div id="error-banner" class="is-hidden">
            <span id="error-message"></span>
            <button onclick="location.reload()" class="retry-pill">Retry</button>
        </div>

        <div id="current-weather" class="weather-hero skeleton">
            <div class="hero-main">
                <div class="location-box">
                    <h1 id="city-name" class="skeleton-text">Ready to search</h1>
                    <p id="full-location" class="skeleton-text">Location details</p>
                    <p id="local-time" class="skeleton-text">--:--</p>
                </div>
                <div class="temp-display">
                    <span id="temp" class="skeleton-text">--°</span>
                    <p id="description" class="skeleton-text">Waiting...</p>
                </div>
            </div>
            <div class="hero-stats">
                <div class="stat">
                    <label>Humidity</label>
                    <b id="humidity" class="skeleton-text">--%</b>
                </div>
                <div class="stat">
                    <label>Wind Speed</label>
                    <b id="wind-speed" class="skeleton-text">-- km/h</b>
                </div>
            </div>
        </div>

        <div id="forecast-row" class="forecast-grid">
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
            <div class="forecast-card skeleton"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
