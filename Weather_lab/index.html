<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name (e.g. Johor Bahru)...">
                <button id="search-btn">Search</button>
            </div>
            <div id="error-banner" class="is-hidden">
                <span id="error-message"></span>
                <button onclick="location.reload()">Retry</button>
            </div>
        </header>

        <main>
            <section id="current-weather" class="card">
                <div class="skeleton-wrapper">
                    <h2 id="city-name" class="skeleton-text">Loading City...</h2>
                    <p id="local-time" class="skeleton-text">--:--</p>
                    <div class="weather-main">
                        <h1 id="temp" class="skeleton-text">--°C</h1>
                        <p id="description" class="skeleton-text">Fetching weather...</p>
                    </div>
                    <div class="weather-details">
                        <p>Humidity: <b id="humidity" class="skeleton-text">--%</b></p>
                        <p>Wind: <b id="wind-speed" class="skeleton-text">-- km/h</b></p>
                    </div>
                </div>
            </section>

            <section id="forecast-row" class="grid">
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
                <div class="forecast-card skeleton"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
